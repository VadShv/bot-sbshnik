# Деплой на ВМ Cloud.ru (или любой Docker-хост).
# secrets держим в .env.docker (не коммитим; см. docs/DEPLOY-cloudru.md).
services:
  bot-sbshnik:
    build: .
    # image: registry.cloud.ru/<ваш-проект>/bot-sbshnik:latest  # при использовании реестра
    container_name: bot-sbshnik
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"   # слушаем только локально; наружу — через nginx/TLS
    volumes:
      - ./data:/data            # постоянный диск с SQLite
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
